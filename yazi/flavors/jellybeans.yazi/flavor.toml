# Jellybeans (https://terminalcolors.com/themes/jellybeans/default/) — generated from themes/jellybeans/palette.toml, do not edit by hand
#
# app.overall.bg is REQUIRED, not cosmetic: yazi's image_erase() paints spaces
# in this colour to clear an image before drawing a modal over it. Leaving it
# unset (the upstream default) makes previews bleed through dialogs.

[app]
overall = { bg = "#121212" }

[mgr]
cwd = { fg = "#b1d8f6" }

hovered = { bg = "#474e91", bold = true }

find_keyword  = { fg = "#ffdca0", bold = true }
find_position = { fg = "#fbdaff", bold = true }

marker_copied   = { fg = "#bddeab", bg = "#bddeab" }
marker_cut      = { fg = "#e27373", bg = "#e27373" }
marker_marked   = { fg = "#b1d8f6", bg = "#b1d8f6" }
marker_selected = { fg = "#ffdca0", bg = "#ffdca0" }

count_copied   = { fg = "#121212", bg = "#bddeab" }
count_cut      = { fg = "#121212", bg = "#e27373" }
count_selected = { fg = "#121212", bg = "#ffdca0" }

border_symbol = "│"
border_style  = { fg = "#2a2a2a" }

[status]
overall = { bg = "#121212" }

perm_sep   = { fg = "#7e7e7e" }
perm_type  = { fg = "#bddeab" }
perm_read  = { fg = "#ffdca0" }
perm_write = { fg = "#e27373" }
perm_exec  = { fg = "#1ab2a8" }

[input]
border   = { fg = "#b1d8f6" }
title    = {}
value    = {}
selected = { bg = "#474e91" }

[pick]
border   = { fg = "#b1d8f6" }
active   = { fg = "#ffdca0", bold = true }
inactive = {}

[which]
mask            = { bg = "#1e1e1e" }
cand            = { fg = "#1ab2a8" }
rest            = { fg = "#7e7e7e" }
desc            = { fg = "#fbdaff" }
separator       = "  "
separator_style = { fg = "#2a2a2a" }

[tasks]
border  = { fg = "#b1d8f6" }
title   = {}
hovered = { fg = "#ffdca0", underline = true }

[notify]
title_info  = { fg = "#1ab2a8" }
title_warn  = { fg = "#ffba7b" }
title_error = { fg = "#e27373" }

[confirm]
border  = { fg = "#b1d8f6", bg = "#121212" }
title   = { fg = "#b1d8f6", bg = "#121212" }
body    = { bg = "#121212" }
list    = { fg = "#1ab2a8", bg = "#121212" }

[filetype]
rules = [
  # Media
  { mime = "**/image/*", fg = "#fbdaff" },
  { mime = "**/{audio,video}/*", fg = "#ffdca0" },
  # Archives / packages
  { mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#ffba7b" },
  { url = "*.{apk,ipa,dmg,pkg}", fg = "#ffba7b" },
  # Documents
  { mime = "**/application/{pdf,doc,rtf}", fg = "#e27373" },
  { url = "*.{md,txt,rst}", fg = "#dedede" },
  # Code / config
  { url = "*.{js,ts,tsx,jsx,lua,py,go,rs,rb,sh,zsh}", fg = "#bddeab" },
  { url = "*.{json,yaml,yml,toml,kdl,ini,conf}", fg = "#1ab2a8" },
  # Virtual file system
  { mime = "vfs/{absent,stale}", fg = "#7e7e7e" },
  # Special
  { url = "*", is = "orphan", fg = "#e27373" },
  { url = "*", is = "exec", fg = "#bddeab" },
  # Fallback
  { url = "*/", fg = "#b1d8f6" },
  { url = "*", fg = "#dedede" }
]

# Icon colors.
#
# yazi paints the glyph in front of every row from its own [icon] table, which
# hard-codes hexes -- the generic folder icon is #03a9f4 under every theme, so
# folders read blue even on a palette whose accent is nothing of the kind.
# These are yazi's own fallback rules (same glyphs, same order, so the specific
# cases still win over the generic ones) with the colors taken from the palette.
# The named entries in its "dirs" table (.git, .config, Downloads, ...) are
# matched earlier and deliberately left alone: those icons are recognized by
# their color as much as their shape.
[icon]
prepend_conds = [
  # Special files
  { if = "orphan", text = "\uf127", fg = "#e27373" },
  { if = "link",   text = "\uf481", fg = "#7e7e7e" },
  { if = "block",  text = "\uf0c9", fg = "#ffba7b" },
  { if = "char",   text = "\uf1c0", fg = "#ffba7b" },
  { if = "fifo",   text = "\uf1d1", fg = "#ffba7b" },
  { if = "sock",   text = "\uf1e4", fg = "#ffba7b" },
  { if = "sticky", text = "\uf08d", fg = "#ffba7b" },
  { if = "dummy",  text = "\uf057", fg = "#e27373" },
  # Fallback
  { if = "dir & hovered", text = "\ue5fe", fg = "#b1d8f6" },
  { if = "dir",           text = "\ue5ff", fg = "#b1d8f6" },
  { if = "exec",          text = "\uf489", fg = "#bddeab" },
  { if = "!dir",          text = "\uf15b", fg = "#dedede" }
]
