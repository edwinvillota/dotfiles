# GitHub Dark (https://terminalcolors.com/themes/github/dark/) — generated from themes/github-dark/palette.toml, do not edit by hand
#
# app.overall.bg is REQUIRED, not cosmetic: yazi's image_erase() paints spaces
# in this colour to clear an image before drawing a modal over it. Leaving it
# unset (the upstream default) makes previews bleed through dialogs.

[app]
overall = { bg = "#0d1117" }

[mgr]
cwd = { fg = "#79c0ff" }

hovered = { bg = "#264f78", bold = true }

find_keyword  = { fg = "#e3b341", bold = true }
find_position = { fg = "#d2a8ff", bold = true }

marker_copied   = { fg = "#56d364", bg = "#56d364" }
marker_cut      = { fg = "#ff7b72", bg = "#ff7b72" }
marker_marked   = { fg = "#79c0ff", bg = "#79c0ff" }
marker_selected = { fg = "#e3b341", bg = "#e3b341" }

count_copied   = { fg = "#0d1117", bg = "#56d364" }
count_cut      = { fg = "#0d1117", bg = "#ff7b72" }
count_selected = { fg = "#0d1117", bg = "#e3b341" }

border_symbol = "│"
border_style  = { fg = "#272b31" }

[status]
overall = { bg = "#0d1117" }

perm_sep   = { fg = "#6e7681" }
perm_type  = { fg = "#56d364" }
perm_read  = { fg = "#e3b341" }
perm_write = { fg = "#ff7b72" }
perm_exec  = { fg = "#56d4dd" }

[input]
border   = { fg = "#79c0ff" }
title    = {}
value    = {}
selected = { bg = "#264f78" }

[pick]
border   = { fg = "#79c0ff" }
active   = { fg = "#e3b341", bold = true }
inactive = {}

[which]
mask            = { bg = "#1a1e24" }
cand            = { fg = "#56d4dd" }
rest            = { fg = "#6e7681" }
desc            = { fg = "#d2a8ff" }
separator       = "  "
separator_style = { fg = "#272b31" }

[tasks]
border  = { fg = "#79c0ff" }
title   = {}
hovered = { fg = "#e3b341", underline = true }

[notify]
title_info  = { fg = "#56d4dd" }
title_warn  = { fg = "#d29922" }
title_error = { fg = "#ff7b72" }

[confirm]
border  = { fg = "#79c0ff", bg = "#0d1117" }
title   = { fg = "#79c0ff", bg = "#0d1117" }
body    = { bg = "#0d1117" }
list    = { fg = "#56d4dd", bg = "#0d1117" }

[filetype]
rules = [
  # Media
  { mime = "**/image/*", fg = "#d2a8ff" },
  { mime = "**/{audio,video}/*", fg = "#e3b341" },
  # Archives / packages
  { mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#d29922" },
  { url = "*.{apk,ipa,dmg,pkg}", fg = "#d29922" },
  # Documents
  { mime = "**/application/{pdf,doc,rtf}", fg = "#ff7b72" },
  { url = "*.{md,txt,rst}", fg = "#e6edf3" },
  # Code / config
  { url = "*.{js,ts,tsx,jsx,lua,py,go,rs,rb,sh,zsh}", fg = "#56d364" },
  { url = "*.{json,yaml,yml,toml,kdl,ini,conf}", fg = "#56d4dd" },
  # Virtual file system
  { mime = "vfs/{absent,stale}", fg = "#6e7681" },
  # Special
  { url = "*", is = "orphan", fg = "#ff7b72" },
  { url = "*", is = "exec", fg = "#56d364" },
  # Fallback
  { url = "*/", fg = "#79c0ff" },
  { url = "*", fg = "#e6edf3" }
]

# Icon colors.
#
# yazi paints the glyph in front of every row from its own [icon] table, which
# hard-codes hexes -- the generic folder icon is #03a9f4 under every theme, so
# folders read blue even on a palette whose accent is nothing of the kind.
# These are yazi's own fallback rules (same glyphs, same order, so the specific
# cases still win over the generic ones) with the colors taken from the palette.
# The named entries in its "dirs" table (.git, .config, Downloads, ...) are
# matched earlier and deliberately left alone: those icons are recognized by
# their color as much as their shape.
[icon]
prepend_conds = [
  # Special files
  { if = "orphan", text = "\uf127", fg = "#ff7b72" },
  { if = "link",   text = "\uf481", fg = "#6e7681" },
  { if = "block",  text = "\uf0c9", fg = "#d29922" },
  { if = "char",   text = "\uf1c0", fg = "#d29922" },
  { if = "fifo",   text = "\uf1d1", fg = "#d29922" },
  { if = "sock",   text = "\uf1e4", fg = "#d29922" },
  { if = "sticky", text = "\uf08d", fg = "#d29922" },
  { if = "dummy",  text = "\uf057", fg = "#ff7b72" },
  # Fallback
  { if = "dir & hovered", text = "\ue5fe", fg = "#79c0ff" },
  { if = "dir",           text = "\ue5ff", fg = "#79c0ff" },
  { if = "exec",          text = "\uf489", fg = "#56d364" },
  { if = "!dir",          text = "\uf15b", fg = "#e6edf3" }
]
