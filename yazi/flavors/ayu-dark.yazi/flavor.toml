# Ayu Dark (https://terminalcolors.com/themes/ayu/dark/) — generated from themes/ayu-dark/palette.toml, do not edit by hand
#
# app.overall.bg is REQUIRED, not cosmetic: yazi's image_erase() paints spaces
# in this colour to clear an image before drawing a modal over it. Leaving it
# unset (the upstream default) makes previews bleed through dialogs.

[app]
overall = { bg = "#0b0e14" }

[mgr]
cwd = { fg = "#59c2ff" }

hovered = { bg = "#131721", bold = true }

find_keyword  = { fg = "#e6b450", bold = true }
find_position = { fg = "#d2a6ff", bold = true }

marker_copied   = { fg = "#aad94c", bg = "#aad94c" }
marker_cut      = { fg = "#ea6c73", bg = "#ea6c73" }
marker_marked   = { fg = "#59c2ff", bg = "#59c2ff" }
marker_selected = { fg = "#e6b450", bg = "#e6b450" }

count_copied   = { fg = "#0b0e14", bg = "#aad94c" }
count_cut      = { fg = "#0b0e14", bg = "#ea6c73" }
count_selected = { fg = "#0b0e14", bg = "#e6b450" }

border_symbol = "│"
border_style  = { fg = "#1f2430" }

[status]
overall = { bg = "#0b0e14" }

perm_sep   = { fg = "#686868" }
perm_type  = { fg = "#aad94c" }
perm_read  = { fg = "#e6b450" }
perm_write = { fg = "#ea6c73" }
perm_exec  = { fg = "#95e6cb" }

[input]
border   = { fg = "#59c2ff" }
title    = {}
value    = {}
selected = { bg = "#131721" }

[pick]
border   = { fg = "#59c2ff" }
active   = { fg = "#e6b450", bold = true }
inactive = {}

[which]
mask            = { bg = "#0d1017" }
cand            = { fg = "#95e6cb" }
rest            = { fg = "#686868" }
desc            = { fg = "#d2a6ff" }
separator       = "  "
separator_style = { fg = "#1f2430" }

[tasks]
border  = { fg = "#59c2ff" }
title   = {}
hovered = { fg = "#e6b450", underline = true }

[notify]
title_info  = { fg = "#95e6cb" }
title_warn  = { fg = "#f9af4f" }
title_error = { fg = "#ea6c73" }

[confirm]
border  = { fg = "#59c2ff", bg = "#0b0e14" }
title   = { fg = "#59c2ff", bg = "#0b0e14" }
body    = { bg = "#0b0e14" }
list    = { fg = "#95e6cb", bg = "#0b0e14" }

[filetype]
rules = [
  # Media
  { mime = "**/image/*", fg = "#d2a6ff" },
  { mime = "**/{audio,video}/*", fg = "#e6b450" },
  # Archives / packages
  { mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#f9af4f" },
  { url = "*.{apk,ipa,dmg,pkg}", fg = "#f9af4f" },
  # Documents
  { mime = "**/application/{pdf,doc,rtf}", fg = "#ea6c73" },
  { url = "*.{md,txt,rst}", fg = "#bfbdb6" },
  # Code / config
  { url = "*.{js,ts,tsx,jsx,lua,py,go,rs,rb,sh,zsh}", fg = "#aad94c" },
  { url = "*.{json,yaml,yml,toml,kdl,ini,conf}", fg = "#95e6cb" },
  # Virtual file system
  { mime = "vfs/{absent,stale}", fg = "#686868" },
  # Special
  { url = "*", is = "orphan", fg = "#ea6c73" },
  { url = "*", is = "exec", fg = "#aad94c" },
  # Fallback
  { url = "*/", fg = "#59c2ff" },
  { url = "*", fg = "#bfbdb6" }
]

# Icon colors.
#
# yazi paints the glyph in front of every row from its own [icon] table, which
# hard-codes hexes -- the generic folder icon is #03a9f4 under every theme, so
# folders read blue even on a palette whose accent is nothing of the kind.
# These are yazi's own fallback rules (same glyphs, same order, so the specific
# cases still win over the generic ones) with the colors taken from the palette.
# The named entries in its "dirs" table (.git, .config, Downloads, ...) are
# matched earlier and deliberately left alone: those icons are recognized by
# their color as much as their shape.
[icon]
prepend_conds = [
  # Special files
  { if = "orphan", text = "\uf127", fg = "#ea6c73" },
  { if = "link",   text = "\uf481", fg = "#686868" },
  { if = "block",  text = "\uf0c9", fg = "#f9af4f" },
  { if = "char",   text = "\uf1c0", fg = "#f9af4f" },
  { if = "fifo",   text = "\uf1d1", fg = "#f9af4f" },
  { if = "sock",   text = "\uf1e4", fg = "#f9af4f" },
  { if = "sticky", text = "\uf08d", fg = "#f9af4f" },
  { if = "dummy",  text = "\uf057", fg = "#ea6c73" },
  # Fallback
  { if = "dir & hovered", text = "\ue5fe", fg = "#59c2ff" },
  { if = "dir",           text = "\ue5ff", fg = "#59c2ff" },
  { if = "exec",          text = "\uf489", fg = "#aad94c" },
  { if = "!dir",          text = "\uf15b", fg = "#bfbdb6" }
]
