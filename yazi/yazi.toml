[mgr]
ratio          = [1, 3, 4]
sort_by        = "natural"
sort_sensitive = false
sort_dir_first = true
linemode       = "size"
show_hidden    = false
show_symlink   = true
scrolloff      = 5

[preview]
max_width  = 1000
max_height = 1000
image_delay  = 30
image_filter = "lanczos3"
image_quality = 85

[opener]
edit = [
  { run = 'nvim %s', desc = "nvim", block = true, for = "unix" },
]
open = [
  { run = 'open %s', desc = "Open with macOS", for = "macos" },
]
# yazi 26.8 deprecated the $@ / $1 shell parameters in opener rules in favour of
# %s (all selected paths) and %s1 (the first one); with $@ the command received
# no arguments at all, so `vd` opened a directory sheet for the cwd.
# VisiData for tabular files. The .visidatarc sniffs the delimiter, so the same
# opener handles comma-, semicolon-, tab- and pipe-separated files.
visidata = [
  { run = 'vd %s', desc = "visidata", block = true, for = "unix" },
]
reveal = [
  { run = 'open -R %s1', desc = "Reveal in Finder", for = "macos" },
]

[open]
prepend_rules = [
  { url = "*/", use = [ "edit", "open", "reveal" ] },
  # chafa previews are for identifying a file, not viewing it -- text in a
  # screenshot is never legible at terminal cell resolution. So Enter on an
  # image opens it in the real macOS viewer; the preview is just the thumbnail.
  { mime = "**/image/*", use = [ "open", "reveal", "edit" ] },
  { mime = "**/{audio,video}/*", use = [ "open", "reveal" ] },
  # Tabular data opens in VisiData on Enter; `o` still offers nvim.
  { url = "*.{csv,CSV,tsv,TSV,psv,PSV}", use = [ "visidata", "edit", "open", "reveal" ] },
  { mime = "**/text/csv", use = [ "visidata", "edit", "open", "reveal" ] },
  { mime = "**/text/tab-separated-values", use = [ "visidata", "edit", "open", "reveal" ] },
  { mime = "**/application/pdf", use = [ "open", "reveal" ] },
]

# [plugin]
# The chafa override is DISABLED. Zellij 0.45 supports the kitty graphics
# protocol, so yazi can use real images again. The plugin is still on disk at
# ~/.config/yazi/plugins/chafa.yazi/ -- re-enable by uncommenting this block if
# image previews ever bleed through modals again.
# prepend_previewers = [
#   { mime = "**/image/*", run = "chafa" },
# ]
# prepend_preloaders = [
#   { mime = "**/image/*", run = "noop" },
# ]
