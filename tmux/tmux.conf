# tmux, set up to feel like the zellij config it replaces (zellij/config.kdl):
# keys go to the app by default ("locked"), Ctrl+g opens a mode menu
# (p pane, t tab, r resize, m move, s scroll, o session), the Alt shortcuts
# work everywhere, and Alt+f toggles a centered floating pane.
# Reason for the switch: zellij drops kitty's unicode image placeholders, so
# vellum / snacks.image showed nothing; tmux passes them through.

# Where this file lives, for the helper scripts next to it. Resolved while the
# file is parsed, so it works from ~/.config/tmux and from the repo alike.
set -gF @tmux_dir "#{d:current_file}"

# -- terminal ----------------------------------------------------------------
set -g default-terminal "tmux-256color"
# Features of the outer terminal: true color, curly/colored underlines, the
# kitty keyboard protocol, OSC 52 clipboard, synchronized output.
set -as terminal-features ",xterm-kitty:RGB:extkeys:usstyle:hyperlinks:sync:clipboard:focus:ccolour:cstyle:strikethrough:overline:title"
set -as terminal-features ",xterm-256color:RGB"
# kitty graphics (vellum, snacks.image, yazi, icat) reach kitty only with this.
set -g allow-passthrough on
set -g extended-keys on
set -g extended-keys-format csi-u
set -sg escape-time 0
set -g focus-events on
set -g set-clipboard on
set -g mouse on
set -g history-limit 50000
set -g mode-keys vi
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-titles on
set -g set-titles-string "#S · #W"

# A session ends when its kitty window closes, instead of piling up detached
# like zellij's EXITED sessions. Floating panes' sessions opt out (they are
# detached every time they are hidden) and are removed with their tab.
set -g destroy-unattached on
set-hook -g session-closed 'run-shell -b "\"#{@tmux_dir}/float\" \"#{socket_path}\" --cleanup"'
set-hook -g window-unlinked 'run-shell -b "\"#{@tmux_dir}/float\" \"#{socket_path}\" --cleanup"'

# -- look (zjstatus from zellij/layouts/default.kdl, ayu dark) ---------------
set -g status-position top
set -g status-interval 10
set -g status-style "bg=default,fg=#686868"
set -g status-left-length 40
set -g status-right-length 160
# Mode badge: blank when "locked" (root), the mode name in red otherwise.
set -g status-left "#{?#{!=:#{client_key_table},root},#[bg=#ea6c73#,fg=#0b0e14#,bold] #{client_key_table} #[default],#{?pane_in_mode,#[bg=#ea6c73#,fg=#0b0e14#,bold] scroll #[default],#[bg=#131721] #[default]}} #[fg=#ea6c73,bold]#S#[default] "
setw -g window-status-format "#[fg=#686868] #W "
setw -g window-status-current-format "#[fg=#e6b450,bold,italics] #W "
setw -g window-status-separator ""
# Right side: git branch and date while locked; the keys of the active mode
# otherwise (what zellij's bottom status bar showed).
set -g status-right "\
#{?#{==:#{client_key_table},normal},#[fg=#e6b450]p #[fg=#686868]pane  #[fg=#e6b450]t #[fg=#686868]tab  #[fg=#e6b450]r #[fg=#686868]resize  #[fg=#e6b450]m #[fg=#686868]move  #[fg=#e6b450]s #[fg=#686868]scroll  #[fg=#e6b450]o #[fg=#686868]session  #[fg=#e6b450]esc #[fg=#686868]back ,}\
#{?#{==:#{client_key_table},pane},#[fg=#e6b450]hjkl #[fg=#686868]focus  #[fg=#e6b450]r #[fg=#686868]right  #[fg=#e6b450]d #[fg=#686868]down  #[fg=#e6b450]n #[fg=#686868]new  #[fg=#e6b450]x #[fg=#686868]close  #[fg=#e6b450]f #[fg=#686868]full  #[fg=#e6b450]w #[fg=#686868]float  #[fg=#e6b450]c #[fg=#686868]rename  #[fg=#e6b450]z #[fg=#686868]frames ,}\
#{?#{==:#{client_key_table},tab},#[fg=#e6b450]hl #[fg=#686868]prev/next  #[fg=#e6b450]1-9 #[fg=#686868]go  #[fg=#e6b450]n #[fg=#686868]new  #[fg=#e6b450]x #[fg=#686868]close  #[fg=#e6b450]r #[fg=#686868]rename  #[fg=#e6b450]b [ ] #[fg=#686868]break pane  #[fg=#e6b450]s #[fg=#686868]sync  #[fg=#e6b450]tab #[fg=#686868]last ,}\
#{?#{==:#{client_key_table},resize},#[fg=#e6b450]hjkl #[fg=#686868]grow  #[fg=#e6b450]HJKL #[fg=#686868]shrink  #[fg=#e6b450]+ - #[fg=#686868]size  #[fg=#e6b450]esc #[fg=#686868]done ,}\
#{?#{==:#{client_key_table},move},#[fg=#e6b450]hjkl #[fg=#686868]move pane  #[fg=#e6b450]n p #[fg=#686868]cycle  #[fg=#e6b450]esc #[fg=#686868]done ,}\
#{?#{==:#{client_key_table},session},#[fg=#e6b450]d #[fg=#686868]detach  #[fg=#e6b450]w #[fg=#686868]sessions  #[fg=#e6b450]esc #[fg=#686868]back ,}\
#{?#{&&:#{==:#{client_key_table},root},#{pane_in_mode}},#[fg=#e6b450]jk du #[fg=#686868]scroll  #[fg=#e6b450]f / #[fg=#686868]search  #[fg=#e6b450]v y #[fg=#686868]select/copy  #[fg=#e6b450]e #[fg=#686868]edit in nvim  #[fg=#e6b450]q #[fg=#686868]exit ,}\
#{?#{&&:#{==:#{client_key_table},root},#{!=:#{pane_in_mode},1}},#[fg=#f9af4f]#(cd '#{pane_current_path}' && git rev-parse --abbrev-ref HEAD 2>/dev/null) #[fg=#686868#,bold] %A#, %d %b %Y %H:%M ,}"

set -g pane-border-style "fg=#1f2430"
set -g pane-active-border-style "fg=#e6b450"
set -g pane-border-lines heavy
set -g pane-border-format " #{pane_index} #{pane_title} "
set -g message-style "bg=#131721,fg=#e6b450"
set -g mode-style "bg=#273747,fg=#e6e1cf"
set -g popup-border-lines rounded
set -g popup-border-style "fg=#e6b450"

# -- modes -------------------------------------------------------------------
# No prefix: like zellij's default "locked" mode every key goes to the app.
# Ctrl+g opens "normal", which picks a mode. A mode stays active until esc,
# enter or Ctrl+g, so each binding in a sticky mode re-enters its table.
set -g prefix None
unbind C-b
bind -n C-g switch-client -T normal

bind -T normal Escape switch-client -T root
bind -T normal Enter switch-client -T root
bind -T normal C-g switch-client -T root
bind -T normal p switch-client -T pane
bind -T normal t switch-client -T tab
bind -T normal r switch-client -T resize
bind -T normal m switch-client -T move
bind -T normal s copy-mode
bind -T normal o switch-client -T session
bind -T normal C-q confirm-before -p "kill session #S? (y/n)" kill-session

# pane (Ctrl+g p)
bind -T pane Escape switch-client -T root
bind -T pane Enter switch-client -T root
bind -T pane C-g switch-client -T root
bind -T pane p switch-client -T normal
bind -T pane h select-pane -L \; switch-client -T pane
bind -T pane j select-pane -D \; switch-client -T pane
bind -T pane k select-pane -U \; switch-client -T pane
bind -T pane l select-pane -R \; switch-client -T pane
bind -T pane Left select-pane -L \; switch-client -T pane
bind -T pane Down select-pane -D \; switch-client -T pane
bind -T pane Up select-pane -U \; switch-client -T pane
bind -T pane Right select-pane -R \; switch-client -T pane
bind -T pane Tab select-pane -t :.+ \; switch-client -T pane
bind -T pane d split-window -v -c "#{pane_current_path}"
bind -T pane r split-window -h -c "#{pane_current_path}"
bind -T pane n if -F "#{e|>:#{pane_width},#{e|*:#{pane_height},2}}" 'split-window -h -c "#{pane_current_path}"' 'split-window -v -c "#{pane_current_path}"'
bind -T pane x kill-pane
bind -T pane f resize-pane -Z
bind -T pane w run-shell -b "'#{@tmux_dir}/float' '#{socket_path}' '#{client_name}' '#{session_name}' '#{window_id}' '#{pane_current_path}' '#{@float_window}'"
bind -T pane c command-prompt -p "pane name:" "select-pane -T '%%'"
bind -T pane z if -F "#{==:#{pane-border-status},off}" "set pane-border-status top" "set pane-border-status off"

# tab (Ctrl+g t)
bind -T tab Escape switch-client -T root
bind -T tab Enter switch-client -T root
bind -T tab C-g switch-client -T root
bind -T tab t switch-client -T normal
bind -T tab h previous-window \; switch-client -T tab
bind -T tab k previous-window \; switch-client -T tab
bind -T tab Left previous-window \; switch-client -T tab
bind -T tab Up previous-window \; switch-client -T tab
bind -T tab l next-window \; switch-client -T tab
bind -T tab j next-window \; switch-client -T tab
bind -T tab Right next-window \; switch-client -T tab
bind -T tab Down next-window \; switch-client -T tab
bind -T tab 1 select-window -t :1
bind -T tab 2 select-window -t :2
bind -T tab 3 select-window -t :3
bind -T tab 4 select-window -t :4
bind -T tab 5 select-window -t :5
bind -T tab 6 select-window -t :6
bind -T tab 7 select-window -t :7
bind -T tab 8 select-window -t :8
bind -T tab 9 select-window -t :9
bind -T tab n new-window -c "#{pane_current_path}"
bind -T tab x kill-window
bind -T tab r command-prompt -I "#W" -p "tab name:" "rename-window '%%'"
bind -T tab b break-pane
bind -T tab [ break-pane -b
bind -T tab ] break-pane -a
bind -T tab s setw synchronize-panes
bind -T tab Tab last-window

# resize (Ctrl+g r): lowercase grows toward a side, uppercase shrinks
bind -T resize Escape switch-client -T root
bind -T resize Enter switch-client -T root
bind -T resize C-g switch-client -T root
bind -T resize r switch-client -T normal
bind -T resize h resize-pane -L 5 \; switch-client -T resize
bind -T resize j resize-pane -D 2 \; switch-client -T resize
bind -T resize k resize-pane -U 2 \; switch-client -T resize
bind -T resize l resize-pane -R 5 \; switch-client -T resize
bind -T resize Left resize-pane -L 5 \; switch-client -T resize
bind -T resize Down resize-pane -D 2 \; switch-client -T resize
bind -T resize Up resize-pane -U 2 \; switch-client -T resize
bind -T resize Right resize-pane -R 5 \; switch-client -T resize
bind -T resize H resize-pane -R 5 \; switch-client -T resize
bind -T resize J resize-pane -U 2 \; switch-client -T resize
bind -T resize K resize-pane -D 2 \; switch-client -T resize
bind -T resize L resize-pane -L 5 \; switch-client -T resize
bind -T resize + resize-pane -R 5 \; resize-pane -D 2 \; switch-client -T resize
bind -T resize = resize-pane -R 5 \; resize-pane -D 2 \; switch-client -T resize
bind -T resize - resize-pane -L 5 \; resize-pane -U 2 \; switch-client -T resize

# move (Ctrl+g m). -d keeps focus on the pane being moved, as zellij does.
bind -T move Escape switch-client -T root
bind -T move Enter switch-client -T root
bind -T move C-g switch-client -T root
bind -T move m switch-client -T normal
bind -T move h swap-pane -d -t "{left-of}" \; switch-client -T move
bind -T move j swap-pane -d -t "{down-of}" \; switch-client -T move
bind -T move k swap-pane -d -t "{up-of}" \; switch-client -T move
bind -T move l swap-pane -d -t "{right-of}" \; switch-client -T move
bind -T move Left swap-pane -d -t "{left-of}" \; switch-client -T move
bind -T move Down swap-pane -d -t "{down-of}" \; switch-client -T move
bind -T move Up swap-pane -d -t "{up-of}" \; switch-client -T move
bind -T move Right swap-pane -d -t "{right-of}" \; switch-client -T move
bind -T move n swap-pane -d -D \; switch-client -T move
bind -T move Tab swap-pane -d -D \; switch-client -T move
bind -T move p swap-pane -d -U \; switch-client -T move

# session (Ctrl+g o). Floating-pane sessions are hidden from the list.
bind -T session Escape switch-client -T root
bind -T session Enter switch-client -T root
bind -T session C-g switch-client -T root
bind -T session o switch-client -T normal
bind -T session d detach-client
bind -T session w choose-tree -Zs -f "#{?#{m:float-*,#{session_name}},0,1}"

# scroll (Ctrl+g s) is tmux copy mode with vi keys, plus zellij's extras
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi d send -X halfpage-down
bind -T copy-mode-vi u send -X halfpage-up
bind -T copy-mode-vi f command-prompt -T search -p "(search down)" "send -X search-forward '%%'"
# e: open the whole scrollback in nvim, like zellij's EditScrollback
bind -T copy-mode-vi e send -X cancel \; display-popup -E -w 90% -h 90% "tmux capture-pane -p -J -S - -t '#{pane_id}' | nvim -R -c 'normal G' -"

# -- Alt shortcuts (zellij's shared "normal" + "locked" bindings) -------------
# At the edge of the tab, Alt+h / Alt+l move to the neighbouring tab.
bind -n M-h if -F "#{pane_at_left}" previous-window "select-pane -L"
bind -n M-Left if -F "#{pane_at_left}" previous-window "select-pane -L"
bind -n M-l if -F "#{pane_at_right}" next-window "select-pane -R"
bind -n M-Right if -F "#{pane_at_right}" next-window "select-pane -R"
bind -n M-j select-pane -D
bind -n M-Down select-pane -D
bind -n M-k select-pane -U
bind -n M-Up select-pane -U
# Alt+n: new pane, split along the longer side (cells are about 2:1)
bind -n M-n if -F "#{e|>:#{pane_width},#{e|*:#{pane_height},2}}" 'split-window -h -c "#{pane_current_path}"' 'split-window -v -c "#{pane_current_path}"'
bind -n M-+ resize-pane -R 5 \; resize-pane -D 2
bind -n M-= resize-pane -R 5 \; resize-pane -D 2
bind -n M-- resize-pane -L 5 \; resize-pane -U 2
# Alt+i / Alt+o: move the tab left / right
bind -n M-i swap-window -t -1 \; select-window -t -1
bind -n M-o swap-window -t +1 \; select-window -t +1
# Alt+f: centered floating pane, one per tab, that keeps running while hidden
bind -n M-f run-shell -b "'#{@tmux_dir}/float' '#{socket_path}' '#{client_name}' '#{session_name}' '#{window_id}' '#{pane_current_path}' '#{@float_window}'"
# Alt+y: key cheatsheet (zellij_forgot)
bind -n M-y display-popup -E -w 76 -h 40 -T " keys " "less -R '#{@tmux_dir}/cheatsheet.txt'"
