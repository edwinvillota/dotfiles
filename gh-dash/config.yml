prSections:
  - title: My PRs
    filters: is:open author:@me
  - title: Needs My Review
    filters: is:open review-requested:@me
  - title: MECBPO
    filters: is:open org:MECBPO -author:@me

issuesSections:
  - title: Assigned
    filters: is:open assignee:@me
  - title: MECBPO
    filters: is:open org:MECBPO

defaults:
  preview:
    open: true
    width: 60
  prsLimit: 20
  issuesLimit: 20
  view: prs
  refetchIntervalMinutes: 5

keybindings:
  prs:
    # Actions on the PR's branch
    - key: r
      name: rerun failed
      command: gh run rerun --failed -R {{.RepoName}} $(gh run list -R {{.RepoName}} -b {{.HeadRefName}} -L1 --json databaseId --jq '.[0].databaseId')
    - key: w
      name: watch run
      command: gh run watch -R {{.RepoName}} $(gh run list -R {{.RepoName}} -b {{.HeadRefName}} -L1 --json databaseId --jq '.[0].databaseId')
    - key: L
      name: failed logs
      command: gh run view -R {{.RepoName}} $(gh run list -R {{.RepoName}} -b {{.HeadRefName}} -L1 --json databaseId --jq '.[0].databaseId') --log-failed | less -R
    - key: A
      name: run list
      command: gh run list -R {{.RepoName}} -L 30 | less -R

# Ayu Dark — palette from ~/.local/share/nvim/lazy/ayu/lua/ayu/colors.lua
theme:
  # generated by `dotfiles theme` — do not edit, switching themes overwrites it (theme: ayu-dark)
  ui:
    table:
      showSeparator: true
      compact: false
  colors:
    text:
      primary: "#bfbdb6"
      secondary: "#59c2ff"
      inverted: "#0b0e14"
      faint: "#686868"
      warning: "#f9af4f"
      success: "#aad94c"
      error: "#ea6c73"
    background:
      selected: "#131721"
    border:
      primary: "#59c2ff"
      secondary: "#1f2430"
      faint: "#0d1017"
