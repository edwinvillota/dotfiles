# Kanagawa Wave — palette fetched verbatim from terminalcolors.com
# (https://terminalcolors.com/themes/kanagawa/wave/, Alacritty export)

name = "kanagawa-wave"
label = "Kanagawa Wave"
source = "https://terminalcolors.com/themes/kanagawa/wave/"
# nvim colorscheme; the plugin providing it is declared in nvim/lua/plugins/colorscheme.lua
nvim = "kanagawa-wave"
[primary]
foreground = "#dcd7ba"
background = "#1f1f28"

[cursor]
text = "#1f1f28"
cursor = "#dcd7ba"

[selection]
text = "#c8c093"
background = "#2d4f67"

[normal]
black = "#16161d"
red = "#c34043"
green = "#76946a"
yellow = "#c0a36e"
blue = "#7e9cd8"
magenta = "#957fb8"
cyan = "#6a9589"
white = "#c8c093"

[bright]
black = "#727169"
red = "#e82424"
green = "#98bb6c"
yellow = "#e6c384"
blue = "#7fb4ca"
magenta = "#938aa9"
cyan = "#7aa89f"
white = "#dcd7ba"
