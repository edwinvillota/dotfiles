# Nord — palette fetched verbatim from terminalcolors.com
# (https://terminalcolors.com/themes/nord/default/, Alacritty export)

name = "nord"
label = "Nord"
source = "https://terminalcolors.com/themes/nord/default/"
# nvim colorscheme; the plugin providing it is declared in nvim/lua/plugins/colorscheme.lua
nvim = "nord"
[primary]
foreground = "#d8dee9"
background = "#2e3440"

[cursor]
text = "#2e3440"
cursor = "#d8dee9"

[selection]
text = "#d8dee9"
background = "#3f4758"

[normal]
black = "#3b4252"
red = "#bf616a"
green = "#a3be8c"
yellow = "#ebcb8b"
blue = "#81a1c1"
magenta = "#b48ead"
cyan = "#88c0d0"
white = "#e5e9f0"

[bright]
black = "#4c566a"
red = "#bf616a"
green = "#a3be8c"
yellow = "#ebcb8b"
blue = "#81a1c1"
magenta = "#b48ead"
cyan = "#8fbcbb"
white = "#eceff4"
