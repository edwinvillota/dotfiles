# Tokyo Night — palette fetched verbatim from terminalcolors.com
# (https://terminalcolors.com/themes/tokyo-night/default/, Alacritty export)

name = "tokyo-night"
label = "Tokyo Night"
source = "https://terminalcolors.com/themes/tokyo-night/default/"
# nvim colorscheme; the plugin providing it is declared in nvim/lua/plugins/colorscheme.lua
nvim = "tokyonight-night"
[primary]
foreground = "#c0caf5"
background = "#1a1b26"

[cursor]
text = "#1a1b26"
cursor = "#c0caf5"

[selection]
text = "#c0caf5"
background = "#283457"

[normal]
black = "#15161e"
red = "#f7768e"
green = "#9ece6a"
yellow = "#e0af68"
blue = "#7aa2f7"
magenta = "#bb9af7"
cyan = "#7dcfff"
white = "#a9b1d6"

[bright]
black = "#414868"
red = "#f7768e"
green = "#9ece6a"
yellow = "#e0af68"
blue = "#7aa2f7"
magenta = "#bb9af7"
cyan = "#7dcfff"
white = "#c0caf5"
