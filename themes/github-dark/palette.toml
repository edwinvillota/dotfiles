# GitHub Dark — palette fetched verbatim from terminalcolors.com
# (https://terminalcolors.com/themes/github/dark/, Alacritty export)

name = "github-dark"
label = "GitHub Dark"
source = "https://terminalcolors.com/themes/github/dark/"
# nvim colorscheme; the plugin providing it is declared in nvim/lua/plugins/colorscheme.lua
nvim = "github_dark_default"
[primary]
foreground = "#e6edf3"
background = "#010409"

[cursor]
text = "#010409"
cursor = "#e6edf3"

[selection]
text = "#e6edf3"
background = "#264f78"

[normal]
black = "#484f58"
red = "#ff7b72"
green = "#3fb950"
yellow = "#d29922"
blue = "#58a6ff"
magenta = "#bc8cff"
cyan = "#39c5cf"
white = "#b1bac4"

[bright]
black = "#6e7681"
red = "#ffa198"
green = "#56d364"
yellow = "#e3b341"
blue = "#79c0ff"
magenta = "#d2a8ff"
cyan = "#56d4dd"
white = "#ffffff"
