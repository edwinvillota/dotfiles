# Dotfiles manifest. Paths in `src` are relative to this file; `dest` supports ~.
# `granular` globs become individually toggleable sub-units in the TUI/CLI.
# `ignore` is never copied in either direction. `secret` is never backed up,
# never installed, and `dotfiles check` refuses to let it be committed.

[global]
ignore = [".DS_Store", ".git/", ".gitkeep"]

[unit.nvim]
src = "nvim"
dest = "~/.config/nvim"
granular = ["lua/plugins/*.lua", "lua/config/*.lua"]
# lua/config/theme-active.lua is machine state written by `dotfiles theme`
ignore = ["*.pyprof", "*.bak*", "lazy-lock.backup", ".claude/", "spell/*.spl", "lua/config/theme-active.lua"]

[unit.zsh]
src = "zsh/config"
dest = "~/.config/zsh"
granular = ["*.zsh"]
# 00-theme.zsh is machine state written by `dotfiles theme`
ignore = ["00-theme.zsh"]
# secret files are stored as <name>.template with values blanked (see README)
secret = ["databases.zsh", "mec.zsh"]

[unit.zshrc]
src = "zsh/.zshrc"
dest = "~/.zshrc"
mode = "backup-only" # install writes it only if absent; never overwrites

[unit.p10k]
src = "powerlevel10k/.p10k.zsh"
dest = "~/.p10k.zsh"

[unit.zellij]
src = "zellij"
dest = "~/.config/zellij"
ignore = ["*.bak*"]

[unit.wezterm]
src = "wezterm"
dest = "~/.config/wezterm"
# theme.lua is machine state written by `dotfiles theme`
ignore = ["theme.lua"]

[unit.omz-custom]
src = "oh-my-zsh/custom"
dest = "~/.oh-my-zsh/custom"
# third-party clones live here on a live machine; they are deps, not config
ignore = ["*.zwc", "themes/powerlevel10k/", "themes/example.zsh-theme", "plugins/example/", "plugins/zsh-*/", "example.zsh"]

# personal keeps everything (mec + gcp are used from home too); work drops them.
# obsidian stays on both.
[profile.personal]
branch = "main"
exclude = []

[profile.work]
branch = "office"
exclude = ["zsh/google-cloud.zsh", "zsh/mec.zsh"]

[secrets]
# extra regexes checked by `dotfiles check` on every file that would be committed
patterns = [
  '(?i)(pwd|passwd|password|pass|token|secret|psk|api[_-]?key)[a-z0-9_]*\s*[:=]\s*\S',
  'PGPASSWORD', 'AKIA[0-9A-Z]{16}', '-----BEGIN [A-Z ]*PRIVATE KEY', '://[^/:@\s]+:[^@\s]+@',
]

# --- SSH: keep the structure, never the keys -------------------------------
# Allowlist only. Private keys, known_hosts and the agent socket dir are never
# seen by the planner. Note: `UseKeychain` in config is macOS-only; the install
# step will prepend `IgnoreUnknown UseKeychain` on Linux so ssh doesn't error.
[unit.ssh]
src = "ssh"
dest = "~/.ssh"
only = ["config", "*.pub"]
granular = ["*.pub"]

# --- TUIs ------------------------------------------------------------------
[unit.gh]
src = "gh"
dest = "~/.config/gh"
only = ["config.yml"]        # hosts.yml holds the oauth token
secret = ["hosts.yml"]

[unit.gh-dash]
src = "gh-dash"
dest = "~/.config/gh-dash"
ignore = ["*.bak"]

[unit.lazydocker]
src = "lazydocker"
dest = { darwin = "~/Library/Application Support/lazydocker", linux = "~/.config/lazydocker" }

[unit.lazysql]
src = "lazysql"
dest = { darwin = "~/Library/Application Support/lazysql", linux = "~/.config/lazysql" }
only = ["config.toml", "saved_queries/*"]   # `history` stays local

[unit.visidata]
src = "visidata/.visidatarc"
dest = "~/.visidatarc"

[unit.colima]
src = "colima"
dest = "~/.colima"
only = ["default/colima.yaml"]   # _store/ and ssh_config are machine-generated

[unit.yazi]
src = "yazi"
dest = "~/.config/yazi"

[unit.btop]
src = "btop"
dest = "~/.config/btop"

[unit.atuin]
src = "atuin"
dest = "~/.config/atuin"
only = ["config.toml"]

[unit.git]
src = "git"
dest = "~/.config/git"

[unit.gitconfig]
src = "git/.gitconfig"
dest = "~/.gitconfig"
mode = "backup-only"   # user/email differ per machine; seed only if absent

# ---------------------------------------------------------------------------
# Dependencies. `dotfiles deps` installs what's missing, skips what's present.
#
# Strategy: Homebrew is the primary manager on BOTH platforms (.zshrc sources
# plugins from $(brew --prefix)/share). On Linux, apt/pacman provide the base
# layer and fall back for anything they carry; Linuxbrew is installed when a
# package is only available there.
#
# Per-package keys (all optional, default = package name everywhere):
#   bin      binary to look for; string or { darwin = "...", linux = "..." }
#   brew     formula name, or { cask = "..." }, or { skip = true }
#   apt/pacman  package name, or { skip = true, note = "..." }
#   min      minimum version (checked with `<bin> --version`)
#   kind     "git" | "gh-extension" | "script"  (non-package installs)
#   needs    other deps that must be present first
#   os       restrict to ["darwin"] / ["linux"]
# ---------------------------------------------------------------------------
[deps]
core = ["git", "curl", "zsh", "nvim", "nvm", "node", "oh-my-zsh", "powerlevel10k", "zellij", "wezterm",
        "fzf", "fd", "ripgrep", "zoxide", "atuin", "carapace", "bat",
        "zsh-autocomplete", "zsh-syntax-highlighting", "zsh-autosuggestions"]
extra = ["yazi", "ffmpeg", "poppler", "sevenzip", "imagemagick", "chafa",
         "btop", "gdu", "dust", "visidata", "lazydocker", "colima", "docker",
         "docker-compose", "gh", "gh-dash", "lazysql"]

[deps.pkg.nvim]
brew = "neovim"
pacman = "neovim"
min = "0.12"
apt = { skip = true, note = "apt ships < 0.12; installed via Homebrew" }

[deps.pkg.nvm]
kind = "git"
url = "https://github.com/nvm-sh/nvm.git"
dest = "~/.nvm"
needs = ["git"]

# node comes from nvm (matching zsh/config/nvm.zsh), never a fixed system node.
# copilot.lua needs >= 22; nvm installs 24.
[deps.pkg.node]
min = "22"
needs = ["nvm", "curl"]
check = 'export NVM_DIR="$HOME/.nvm"; [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh" >/dev/null 2>&1; node --version'
run = 'export NVM_DIR="$HOME/.nvm"; . "$NVM_DIR/nvm.sh" >/dev/null 2>&1; nvm install 24'

[deps.pkg.oh-my-zsh]
kind = "git"
url = "https://github.com/ohmyzsh/ohmyzsh.git"
dest = "~/.oh-my-zsh"
needs = ["git", "zsh"]

[deps.pkg.powerlevel10k]
bin = { darwin = "/opt/homebrew/share/powerlevel10k/powerlevel10k.zsh-theme", linux = "/home/linuxbrew/.linuxbrew/share/powerlevel10k/powerlevel10k.zsh-theme" }
pacman = "zsh-theme-powerlevel10k"
apt = { skip = true }

[deps.pkg.zsh-autocomplete]
bin = { darwin = "/opt/homebrew/share/zsh-autocomplete/zsh-autocomplete.plugin.zsh", linux = "/home/linuxbrew/.linuxbrew/share/zsh-autocomplete/zsh-autocomplete.plugin.zsh" }
apt = { skip = true }
pacman = { skip = true, note = "AUR only; installed via Homebrew" }

[deps.pkg.zsh-syntax-highlighting]
bin = { darwin = "/opt/homebrew/share/zsh-syntax-highlighting/zsh-syntax-highlighting.zsh", linux = "/home/linuxbrew/.linuxbrew/share/zsh-syntax-highlighting/zsh-syntax-highlighting.zsh" }
apt = { skip = true, note = ".zshrc sources it from brew prefix" }
pacman = { skip = true }

[deps.pkg.zsh-autosuggestions]
bin = { darwin = "/opt/homebrew/share/zsh-autosuggestions/zsh-autosuggestions.zsh", linux = "/home/linuxbrew/.linuxbrew/share/zsh-autosuggestions/zsh-autosuggestions.zsh" }
apt = { skip = true, note = ".zshrc sources it from brew prefix" }
pacman = { skip = true }

[deps.pkg.wezterm]
bin = { darwin = "/Applications/WezTerm.app/Contents/MacOS/wezterm", linux = "wezterm" }
brew = { cask = "wezterm" }
pacman = "wezterm"
apt = { skip = true, note = "no repo package; installed from the official .deb below" }
# official release .debs
deb = { amd64 = "https://github.com/wezterm/wezterm/releases/download/20240203-110809-5046fc22/wezterm-20240203-110809-5046fc22.Ubuntu22.04.deb", arm64 = "https://github.com/wezterm/wezterm/releases/download/20240203-110809-5046fc22/wezterm-20240203-110809-5046fc22.Ubuntu22.04.arm64.deb" }
os = ["darwin", "linux"]

# --- adding another terminal later (e.g. ghostty) is two blocks: -----------
# [unit.ghostty]
# src = "ghostty"
# dest = "~/.config/ghostty"
#
# [deps.pkg.ghostty]
# brew = { cask = "ghostty" }
# pacman = "ghostty"
# apt = { skip = true, note = "installed from .deb" }
# deb = { amd64 = "https://github.com/mkasberg/ghostty-ubuntu/releases/download/<ver>/ghostty_<ver>_amd64_24.04.deb" }

[deps.pkg.fd]
apt = "fd-find"
bin = { darwin = "fd", linux = "fd" }   # apt's binary is fdfind; brew's is fd

[deps.pkg.ripgrep]
bin = "rg"

[deps.pkg.bat]
bin = "bat"   # apt names it batcat; we prefer brew's `bat` so .zshrc aliases work

[deps.pkg.carapace]
apt = { skip = true }
pacman = { skip = true, note = "AUR (carapace-bin); via Homebrew" }

[deps.pkg.atuin]
apt = { skip = true }

[deps.pkg.zellij]
apt = { skip = true }

[deps.pkg.zoxide]

[deps.pkg.sevenzip]
bin = "7zz"
apt = "7zip"
pacman = "7zip"

[deps.pkg.poppler]
bin = "pdftoppm"
apt = "poppler-utils"

[deps.pkg.imagemagick]
bin = "magick"

[deps.pkg.gdu]
bin = { darwin = "gdu-go", linux = "gdu" }   # brew's gdu collides with coreutils on macOS

[deps.pkg.dust]
apt = { skip = true }

[deps.pkg.visidata]
bin = "vd"

[deps.pkg.yazi]
apt = { skip = true }

[deps.pkg.lazydocker]
apt = { skip = true }

[deps.pkg.lazysql]
apt = { skip = true }
pacman = { skip = true, note = "AUR; via Homebrew" }

[deps.pkg.colima]
os = ["darwin"]

[deps.pkg.docker]
brew = { skip = true, note = "on macOS the docker CLI comes with colima: `brew install docker` is fine but colima is the runtime" }
apt = "docker.io"
os = ["linux", "darwin"]

[deps.pkg.docker-compose]
bin = "docker-compose"
apt = "docker-compose-v2"

[deps.pkg.gh]
pacman = "github-cli"

[deps.pkg.gh-dash]
kind = "gh-extension"
name = "dlvhdr/gh-dash"
needs = ["gh"]

[deps.pkg.homebrew]
kind = "script"
bin = "brew"
url = "https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh"
apt_prereqs = ["build-essential", "curl", "file", "git", "procps"]
pacman_prereqs = ["base-devel", "curl", "file", "git", "procps-ng"]
