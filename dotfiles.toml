# Dotfiles manifest. Paths in `src` are relative to this file; `dest` supports ~.
# `granular` globs become individually toggleable sub-units in the TUI/CLI.
# `ignore` is never copied in either direction. `secret` is never backed up,
# never installed, and `dotfiles check` refuses to let it be committed.

[global]
ignore = [".DS_Store", ".git/", ".gitkeep"]

[unit.nvim]
src = "nvim"
dest = "~/.config/nvim"
granular = ["lua/plugins/*.lua", "lua/config/*.lua"]
ignore = ["*.pyprof", "*.bak*", "lazy-lock.backup", ".claude/", "spell/*.spl"]

[unit.zsh]
src = "zsh/config"
dest = "~/.config/zsh"
granular = ["*.zsh"]
secret = ["databases.zsh"]

[unit.zshrc]
src = "zsh/.zshrc"
dest = "~/.zshrc"
mode = "backup-only" # install writes it only if absent; never overwrites

[unit.p10k]
src = "powerlevel10k/.p10k.zsh"
dest = "~/.p10k.zsh"

[unit.zellij]
src = "zellij"
dest = "~/.config/zellij"
ignore = ["*.bak*"]

[unit.wezterm]
src = "wezterm"
dest = "~/.config/wezterm"

[unit.omz-custom]
src = "oh-my-zsh/custom"
dest = "~/.oh-my-zsh/custom"
# third-party clones live here on a live machine; they are deps, not config
ignore = ["*.zwc", "themes/powerlevel10k/", "themes/example.zsh-theme", "plugins/example/", "plugins/zsh-*/", "example.zsh"]

[profile.personal]
branch = "main"
exclude = ["zsh/mec.zsh"]

[profile.work]
branch = "office"
exclude = ["zsh/google-cloud.zsh", "nvim/lua/plugins/obsidian.lua"]

[secrets]
# extra regexes checked by `dotfiles check` on every file that would be committed
patterns = ['(?i)password\s*=', 'PGPASSWORD', 'AKIA[0-9A-Z]{16}', '-----BEGIN [A-Z ]*PRIVATE KEY', '(?i)api[_-]?key\s*[:=]']
