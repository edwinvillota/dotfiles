# kitty — counterpart to wezterm/wezterm.lua. Managed by `dotfiles`; the
# generated theme.conf beside it is machine state written by `dotfiles theme`.

# Launch zellij when installed, else the login shell. kitty has no config
# scripting and execs `shell` without expanding ~ or $VARS, so the search
# lives in zellij-launch and env + sh expand $HOME to reach it.
shell /usr/bin/env sh -c "exec \"$HOME/.config/kitty/zellij-launch\""

# Removing window padding
window_padding_width 0

# Set terminal font. wezterm accepts the "IosevkaTerm NF" family, but kitty
# only takes monospaced faces and the plain NF variant is not one (its Nerd
# Font icons are double-width), so kitty needs the Mono (NFM) build and the
# CoreText typographic family name. Styles are pinned because weight matching
# otherwise picks SemiBold for bold.
font_family      family="IosevkaTerm Nerd Font Mono" style=Regular
bold_font        family="IosevkaTerm Nerd Font Mono" style=Bold
italic_font      family="IosevkaTerm Nerd Font Mono" style=Italic
bold_italic_font family="IosevkaTerm Nerd Font Mono" style="Bold Italic"
font_size 16.0

# Nerd Font icons at their natural width. The Mono build squeezes every icon
# into one cell, which is why it has to be the base font -- kitty rejects the
# proportional build outright -- but it also makes the icons visibly smaller
# than wezterm drew them. Mapping just the icon blocks back to the plain NF
# build restores wezterm's sizing while text stays on the monospaced faces.
# Box drawing (U+2500-259F) is deliberately absent: it must stay on the base
# font so zellij and nvim borders keep meeting cleanly.
#
# This works through CoreText, which loads the proportional build happily as a
# symbol font even though it rejects it as font_family. FreeType does not, so
# on Linux the icons stay at Mono's single-cell size and this line is inert.
symbol_map U+23FB-U+23FE,U+2B58,U+E000-U+E00A,U+E0A0-U+E0A2,U+E0A3,U+E0B0-U+E0B3,U+E0B4-U+E0C8,U+E0CA,U+E0CC-U+E0D7,U+E200-U+E2A9,U+E300-U+E3E3,U+E5FA-U+E6B7,U+E700-U+E8EF,U+EA60-U+EC1E,U+ED00-U+EFCE,U+F000-U+F2FF,U+F300-U+F381,U+F400-U+F533,U+F0001-U+F1AF0 IosevkaTerm Nerd Font

# macOS draws kitty's text thinner than wezterm did. This adds stem weight
# back; it takes 0 (kitty's default) to about 0.75, so nudge it if the text
# still reads light or starts to look smudged.
macos_thicken_font 0.4

# Hide the tab bar unless a second tab exists (zellij owns tabs in practice)
tab_bar_min_tabs 2

# macOS: keep the titlebar painted with the window background rather than
# letting the system glass show through it, which is what left wezterm's
# fancy tab bar transparent on macOS 26+.
macos_titlebar_color background
macos_option_as_alt yes

# No scrollbar to disable (kitty draws none); zellij handles scrollback.
confirm_os_window_close 0

# Default colors: Ayu Dark, the same fallback wezterm.lua carries inline.
# `dotfiles theme` writes theme.conf, included last so it wins. A missing
# theme.conf is a warning in kitty's log, never a startup failure.
foreground #bfbdb6
background #0b0e14
cursor #bfbdb6
cursor_text_color #0b0e14
selection_foreground #bfbdb6
selection_background #1b3a5b
color0 #1e232b
color1 #ea6c73
color2 #7fd962
color3 #f9af4f
color4 #53bdfa
color5 #cda1fa
color6 #90e1c6
color7 #c7c7c7
color8 #686868
color9 #f07178
color10 #aad94c
color11 #ffb454
color12 #59c2ff
color13 #d2a6ff
color14 #95e6cb
color15 #ffffff

include theme.conf
