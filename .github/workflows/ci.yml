name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go vet ./... && go test ./...
      - run: go build -o bin/dotfiles ./cmd/dotfiles && ./bin/dotfiles check
      - run: make test
